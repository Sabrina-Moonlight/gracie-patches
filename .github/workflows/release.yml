name: Release

# Compila el .mpp, publica Release, actualiza patches-list y patches-bundle.
# No borra releases anteriores (si un build falla, Manager sigue pudiendo usar el .mpp bueno).
on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar MPP y publicar Release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Calcular versión
        id: ver
        run: |
          if [ ! -f gradle.properties ]; then
            echo "version = 1.0.0" > gradle.properties
          fi
          if ! grep -qE '^version' gradle.properties; then
            echo "version = 1.0.0" >> gradle.properties
          fi
          base=$(grep -E '^version' gradle.properties | head -1 | sed 's/.*=[ \t]*//' | tr -d '\r ')
          ultima=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          sig=""
          if [ -n "$ultima" ]; then
            sig="${ultima%.*}.$(( ${ultima##*.} + 1 ))"
          fi
          nueva=$(printf '%s\n%s\n' "$base" "$sig" | grep . | sort -V | tail -1)
          sed -i "s/^version.*/version = $nueva/" gradle.properties
          echo "version=$nueva" >> "$GITHUB_OUTPUT"
          echo "Versión: $nueva"

      - name: Compilar y generar lista de patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Actualizar lista y paquete de patches
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -f patches-list.json ]; then
            jq ".version = \"$VERSION\"" patches-list.json > patches-list.json.tmp
            mv patches-list.json.tmp patches-list.json
          fi

          if [ -f .github/scripts/generate_patches_readme.py ]; then
            python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "main" patches-list.json README.md || true
          fi

          MPP=$(ls patches/build/libs/patches-*.mpp | grep -v javadoc | head -1)
          MPP_NAME=$(basename "$MPP")
          # ISO-8601 con T (como hxreborn / Heval). Nunca usar fecha con ':' entre día y hora.
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%S")

          cat > patches-bundle.json << JSON
          {
            "created_at": "$CREATED",
            "description": "Patches for apps I like",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${MPP_NAME}",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          JSON

          echo "patches-bundle.json:"
          cat patches-bundle.json
          python3 -c "import json; json.load(open('patches-bundle.json')); print('JSON OK')"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MPP=$(ls patches/build/libs/patches-*.mpp | grep -v javadoc | head -1)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag || true
          fi
          gh release create "v$VERSION" "$MPP" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Subir MPP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error

      - name: Guardar lista en main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md patches-list.json patches-bundle.json gradle.properties || true
          if git diff --cached --quiet; then
            echo "Nada que guardar"
          else
            git commit -m "chore: Release v$VERSION [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
